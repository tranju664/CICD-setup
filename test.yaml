apiVersion: v1
kind: Namespace
metadata:
  name: ss-ENVIRONMENT

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: ss-ENVIRONMENT-pv-efs
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: edx-efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-05354c677216c3dca

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ss-ENVIRONMENT-pvc-efs
  namespace: ss-dev
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: edx-efs-sc
  volumeName: ss-ENVIRONMENT-pv-efs
  resources:
    requests:
      storage: 5Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-springboot
  namespace: ss-ENVIRONMENT
  annotations:
    kubernetes.io/change-cause: "Release 1.1 Version"
  labels:
    app: ss
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ss
  template:
    metadata:
      labels:
        app: ss
    spec:
      # serviceAccountName: eks-sa
      automountServiceAccountToken: false
      restartPolicy: Always
      containers:
        - name: ss
          image: 804480554088.dkr.ecr.ap-south-1.amazonaws.com/sstest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: persistent-storage
              mountPath: /efs
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: ss-dev-pvc-efs

---

apiVersion: v1
kind: Service
metadata:
  name: ss
  namespace: ss-ENVIRONMENT
spec:
  type: NodePort
  selector:
    app: ss
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ss-alb-ingress
  namespace: ss-ENVIRONMENT
  labels:
    app: ss
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    #alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    #alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:804480554088:certificate/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200,302"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/load-balancer-name: ss-dev-alb
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ss
                port:
                  number: 8080

